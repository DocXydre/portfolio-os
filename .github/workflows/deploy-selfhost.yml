name: Deploy to self-hosted server (via Tailscale)

# git push sur main → GitHub compile → rejoint ton réseau Tailscale →
# pousse le site sur ton serveur (l'Atom) en SSH. Le SSH n'est jamais exposé
# sur Internet : GitHub y accède uniquement par le réseau privé Tailscale.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: selfhost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Site servi à la racine du domaine → base-href /
      - run: npm run build -- --base-href /

      # Rejoint ton réseau Tailscale (nœud éphémère, retiré en fin de job)
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Déployer (rsync via Tailscale)
        run: |
          rsync -avz --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            dist/portfolio-windowsxp/browser/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
