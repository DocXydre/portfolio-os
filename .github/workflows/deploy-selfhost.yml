name: Deploy to self-hosted server

# Déploiement "depuis n'importe où" : tu fais git push, GitHub compile,
# puis pousse le site déjà buildé sur le serveur (Atom) en SSH via rsync.
# Le vieux PC ne compile jamais.

# Manuel pour l'instant (onglet Actions → Run workflow). Quand le serveur et les
# secrets sont prêts, décommente le bloc "push" pour déployer à chaque git push.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: selfhost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Site servi à la racine du domaine → base-href /
      - run: npm run build -- --base-href /

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Déployer (rsync)
        run: |
          rsync -avz --delete --chmod=D755,F644 \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/id_deploy" \
            dist/portfolio-windowsxp/browser/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
